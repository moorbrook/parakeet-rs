# Developer-only bench arm for Hex's speech engine (kata mspd).
#
# A standalone package, deliberately not a member of the app's workspace and
# not a dependency of it: the app's Cargo.toml and Cargo.lock never see
# transcribe.cpp. A dev-dependency was rejected because it would compile ggml
# and its Metal shaders on every `cargo test` of the app and change the app's
# lock file. This package depends on the app library by path so both arms
# share the resampler, WAV reader, gold scoring, capture path and RSS probe.
[package]
name = "hex-engine-bench"
version = "0.1.0"
edition = "2021"
publish = false
license = "MIT OR Apache-2.0"

[workspace]

[[bin]]
name = "bench_hex"
path = "src/main.rs"

[dependencies]
parakeet-dictation = { path = "../.." }
anyhow = "1"
cpal = "0.15"
env_logger = "0.11"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Hex pins transcribe-cpp 0.4.1 and patches it to its fork; mirror both.
transcribe-cpp = { version = "=0.4.1", default-features = false, features = ["metal"] }

[patch.crates-io]
transcribe-cpp = { git = "https://github.com/anomalyco/transcribe.cpp", rev = "7045d1c0fe7cee37747b2792977421d435e75fca" }
transcribe-cpp-sys = { git = "https://github.com/anomalyco/transcribe.cpp", rev = "7045d1c0fe7cee37747b2792977421d435e75fca" }
